services:
  postgres:
    image: postgres:16-alpine
    container_name: aurora_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora123
      POSTGRES_DB: aurora
    volumes:
      - pg_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-enterprise
    container_name: aurora_neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aurora_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: aurora_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurora_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - neo4j
      - qdrant
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aurora_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pg_data:
  neo4j_data:
  qdrant_data:
  redis_data:
